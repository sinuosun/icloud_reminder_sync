<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iCloud 日历同步</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">iCloud <span>日历</span></div>
      <div class="brand-subtitle">由本地 Outlook 同步</div>
    </div>

    <div class="topbar-center">
      <button class="seg-btn active" data-view="day">日</button>
      <button class="seg-btn" data-view="week">周</button>
      <button class="seg-btn" data-view="month">月</button>
    </div>

    <div class="topbar-actions">
      <button class="icon-action" id="syncBtn" title="立即同步">⟳</button>
      <button class="nav-btn" id="prevBtn">‹</button>
      <button class="today-btn" id="todayBtn">今天</button>
      <button class="nav-btn" id="nextBtn">›</button>
      <button class="add-btn" id="quickAddBtn" title="新建日程">＋</button>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="mode-icons">
        <button class="mode-icon active">▦</button>
        <button class="mode-icon">▱</button>
        <button class="more-btn" id="sidebarMenuBtn">•••</button>
      </div>

      <div class="sidebar-title-row">
        <h2>日历</h2>
        <button class="sidebar-plus" id="sidebarAddBtn">＋</button>
      </div>

      <ul class="calendar-list" id="calendarList"></ul>

      <div class="sync-pill" id="syncStatus">
        <span class="sync-dot"></span>
        <span>已同步</span>
      </div>
    </aside>

    <main class="calendar-stage">
      <div class="period-row">
        <h1 id="periodTitle"></h1>
      </div>

      <section class="calendar-view day-view active" id="dayView">
        <div class="day-lane-wrap">
          <div class="day-title" id="dayTitle"></div>
          <div class="time-scroll" id="dayScroll">
            <div class="time-gutter" id="dayGutter"></div>
            <div class="time-lane" id="dayLane"></div>
          </div>
        </div>
        <aside class="right-panel" id="rightPanel"></aside>
      </section>

      <section class="calendar-view week-view" id="weekView">
        <div class="week-head" id="weekHead"></div>
        <div class="week-scroll" id="weekScroll">
          <div class="time-gutter" id="weekGutter"></div>
          <div class="week-grid" id="weekGrid"></div>
        </div>
      </section>

      <section class="calendar-view month-view" id="monthView">
        <div class="month-head">
          <span>周日</span><span>周一</span><span>周二</span><span>周三</span>
          <span>周四</span><span>周五</span><span>周六</span>
        </div>
        <div class="month-grid" id="monthGrid"></div>
      </section>
    </main>
  </div>

  <div class="context-menu" id="sidebarMenu">
    <button>⚙ 设置</button>
    <button>◎ 显示已拒绝的日程</button>
    <button>▭ 前往日期…</button>
    <button class="danger">⊖ 删除日程</button>
  </div>

  <div class="popover" id="eventPopover"></div>
  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
